[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "outbreak-ledger"
version = "0.5.3"
description = "Auditable, locally owned intelligence from public outbreak reports (prototype)"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["pdfplumber>=0.11", "reportlab>=4.0", "PyYAML>=6.0", "pypdfium2>=5.0"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools]
packages = ["outbreak_ledger", "config", "samples"]

[tool.setuptools.package-data]
outbreak_ledger = ["web_assets/*"]
config = ["*.yaml"]
samples = ["reports/*.pdf", "*.csv"]
